steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/career-tracker/app-backend:$SHORT_SHA
      - ./backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/career-tracker/app-backend:$SHORT_SHA

  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - app-backend
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/career-tracker/app-backend:$SHORT_SHA
      - --platform=managed
      - --region=${_REGION}
      - --allow-unauthenticated
      - --port=3001
      - --add-cloudsql-instances=${_INSTANCE_CONNECTION_NAME}
      - --set-env-vars=DB_NAME=application_tracker,DB_USER=tracker,DB_SOCKET_PATH=/cloudsql/${_INSTANCE_CONNECTION_NAME},COOKIE_SECURE=true
      - --set-secrets=DB_PASSWORD=db-password:latest,JWT_SECRET=jwt-secret:latest

substitutions:
  _REGION: us-central1
  _INSTANCE_CONNECTION_NAME: applicationtrackerapp:us-central1:career-tracker-mysql

options:
  logging: CLOUD_LOGGING_ONLY
