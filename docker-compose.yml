services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: application_tracker
      MYSQL_USER: tracker
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-development-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-development-root-password}
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 3001
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: application_tracker
      DB_USER: tracker
      DB_PASSWORD: ${DB_PASSWORD:-local-development-password}
      JWT_SECRET: ${JWT_SECRET:-career-tracker-local-development-secret-change-before-deploy}
      COOKIE_SECURE: "false"
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:3001
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  database-data:
